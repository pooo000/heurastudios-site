# The Datasets page (/datasets/): what's hand-picked on it. The sets themselves are _data/datasets.json, made from the
# app's dataset library with _tools/make-datasets.py (don't edit that file by hand: run the tool again).

# The featured row under the page's title, one set from each of the topics Ryan named first ("engineering, CAD
# modeling, coding, identifying", Nov 17): slugs from _data/datasets.json, in order.
featured: [mechanical-civil-engineering, cad-software, python, identify-support-intent]

# Each topic's icon: the inner SVG of a 20x20 line icon, drawn like the Tools page's (stroke 1.3, square caps, mitred
# corners). A topic the app adds needs one here before make-datasets.py will run.
